async function decrypt(pw){
  const enc = new TextEncoder();
  const keyMat = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name:'PBKDF2', salt:b64d(ENC.salt), iterations:ENC.rounds, hash:'SHA-256' },
    keyMat, { name:'AES-GCM', length:256 }, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv:b64d(ENC.iv) }, key, b64d(ENC.ct));
  return new TextDecoder().decode(pt);
}
async function unlock(){
  const pw = document.getElementById('pw').value;
  const err = document.getElementById('err');
  err.textContent = '';
  try {
    const html = await decrypt(pw);
    sessionStorage.setItem('mz_pw', pw);  // 同会话内下钻页免再输
    document.open(); document.write(html); document.close();
  } catch(e) {
    err.textContent = '密码错误';
  }
}
document.getElementById('go').onclick = unlock;
document.getElementById('pw').addEventListener('keydown', e => { if(e.key==='Enter') unlock(); });
// 同会话内若已输过密码，自动解锁
(async () => {
  const saved = sessionStorage.getItem('mz_pw');
  if(saved){ try { const html = await decrypt(saved); document.open(); document.write(html); document.close(); } catch(e){} }
})();
</script>
