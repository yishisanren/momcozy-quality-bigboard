<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Momcozy App 质量大盘</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
         background:#0f1115; color:#e6e8eb; padding:24px; max-width:1200px; margin:0 auto; }
  h1 { font-size:22px; font-weight:600; margin-bottom:4px; }
  .sub { color:#8b919a; font-size:13px; margin-bottom:24px; }
  .sub a.back, .sub a { color:#5ac8fa; text-decoration:none; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  .card { background:#1a1d24; border:1px solid #262a33; border-radius:14px; padding:18px 18px 14px;
          display:flex; flex-direction:column; gap:6px; min-height:200px; }
  .card.clickable { cursor:pointer; transition:border-color .15s, transform .15s; }
  .card.clickable:hover { border-color:#5ac8fa; transform:translateY(-2px); }
  .card.nodata { opacity:0.5; border-style:dashed; }
  .ctitle { font-size:13.5px; color:#9aa0a9; display:flex; justify-content:space-between; align-items:center; }
  .drill { font-size:11.5px; color:#5ac8fa; }
  .cval { font-size:30px; font-weight:700; font-variant-numeric:tabular-nums; line-height:1.1; }
  .cval.nd { font-size:17px; color:#6b7280; font-weight:600; margin-top:30px; }
  .csub { font-size:11px; color:#7b818a; line-height:1.4; }
  .cdelta { font-size:11.5px; }
  .delta.dim { color:#6b7280; }
  canvas { width:100%!important; height:70px!important; margin-top:6px; }
  @media(max-width:900px){ .grid { grid-template-columns:repeat(2,1fr); } }
  @media(max-width:560px){ .grid { grid-template-columns:1fr; } }
</style>
</head>
<body>
  <h1>Momcozy App 质量大盘</h1>
  <div class="sub">数据日期：2026-06-10 · 生成：2026-06-11 18:39</div>
  <div class="grid"><div class="card">

    <div class="cval" style="color:#3ddc84">0.0002%</div><div class="csub">v2.2.9.5 · 1次/1人 · 目标≤0.06%</div><div class="cdelta"><span class="delta" style="color:#3ddc84">较前日 ▼0.0008pp</span></div><canvas id="chIos" height="70"></canvas>
  </div><div class="card">
    <div class="ctitle">Android 客户端崩溃率</div>
    <div class="cval" style="color:#3ddc84">0.0331%</div><div class="csub">v2.2.9 · 1次/1人 · 目标≤0.1%</div><div class="cdelta"><span class="delta" style="color:#3ddc84">较前日 ▼0.0104pp</span></div><canvas id="chAnd" height="70"></canvas>
  </div><div class="card clickable" onclick="location.href='netcfg.html'">
    <div class="ctitle">一次配网成功率<span class="drill">查看型号 ›</span></div>
    <div class="cval" style="color:#ffd166">91.00%</div><div class="csub">总体 · 点击查看各型号</div><div class="cdelta"><span class="delta" style="color:#ff5c5c">较前日 ▼1.1900pp</span></div><canvas id="chNet" height="70"></canvas>
  </div><div class="card nodata">
    <div class="ctitle">账号登录成功率</div>
    <div class="cval nd">暂无数据</div><div class="csub">接口接入后自动呈现</div>
  </div><div class="card nodata">

    <div class="cval nd">暂无数据</div><div class="csub">接口接入后自动呈现</div>

  </div></div>
<script>
const CHARTS = {"chIos": {"dates": ["2026-05-12", "2026-05-13", "2026-05-14", "2026-05-15", "2026-05-16", "2026-05-17", "2026-05-18", "2026-05-19", "2026-05-20", "2026-05-21", "2026-05-22", "2026-05-23", "2026-05-24", "2026-05-25", "2026-05-26", "2026-05-27", "2026-05-28", "2026-05-29", "2026-05-30", "2026-05-31", "2026-06-01", "2026-06-02", "2026-06-03", "2026-06-04", "2026-06-05", "2026-06-06", "2026-06-07", "2026-06-08", "2026-06-09", "2026-06-10"], "cur": [0, 0, 0, 0, 0, 0.0061, 0.0014, 0.001, 0.0014, 0.0015, 0.0009, 0.0017, 0.0011, 0.0008, 0.0003, 0.0009, 0.001, 0.0007, 0.0013, 0.0012, 0.0014, 0.0008, 0.0011, 0.0013, 0.0002, 0.0012, 0.0006, 0.0007, 0.001, 0.0002], "label": "iOS 客户端崩溃率", "color": "#3ddc84"}, "chAnd": {"dates": ["2026-05-12", "2026-05-13", "2026-05-14", "2026-05-15", "2026-05-16", "2026-05-17", "2026-05-18", "2026-05-19", "2026-05-20", "2026-05-21", "2026-05-22", "2026-05-23", "2026-05-24", "2026-05-25", "2026-05-26", "2026-05-27", "2026-05-28", "2026-05-29", "2026-05-30", "2026-05-31", "2026-06-01", "2026-06-02", "2026-06-03", "2026-06-04", "2026-06-05", "2026-06-06", "2026-06-07", "2026-06-08", "2026-06-09", "2026-06-10"], "cur": [0, 1.8519, 1.0417, 1.5385, 0, 0.2849, 0.4315, 0.0262, 0.0512, 0.037, 0.0785, 0.085, 0.0886, 0.0723, 0.1428, 0.0968, 0.0646, 0.0738, 0.0995, 0.0932, 0.0735, 0.0617, 0.0742, 0.0877, 0.0727, 0.1115, 0.0551, 0.0557, 0.0435, 0.0331], "label": "Android 客户端崩溃率", "color": "#3ddc84"}, "chNet": {"dates": ["2026-06-09", "2026-06-10"], "cur": [92.19, 91.0], "label": "一次配网成功率", "color": "#ffd166"}};

function miniChart(id, cfg){
  const el = document.getElementById(id);
  if(!el) return;
  new Chart(el, {
    type:'line',
    data:{ labels:cfg.dates, datasets:[
      { label:cfg.label, data:cfg.cur, borderColor:cfg.color,
        backgroundColor:cfg.color+'22', tension:0.3, pointRadius:2,
        borderWidth:2, fill:true, spanGaps:true }
    ]},
    options:{ responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false}, tooltip:{enabled:true} },
      scales:{
        x:{ grid:{display:false}, ticks:{color:'#5b616b', font:{size:8}, maxTicksLimit:5} },
        y:{ grid:{color:'#1c2027'}, ticks:{color:'#5b616b', font:{size:9}, maxTicksLimit:3} }
      } }
  });
}
Object.entries(CHARTS).forEach(([id,cfg]) => miniChart(id, cfg));

</script>
</body>
</html>
